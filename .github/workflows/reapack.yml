name: Build ReaPack Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - "index.xml"
      
permissions:
  contents: write
  
jobs:
  reapack-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Confirms the action has permission to update your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so reapack-index can extract older versions from Git history

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run reapack-index help
        run: reapack-index --help

      - name: Install reapack-index
        run: gem install reapack-index

      - name: Run reapack-index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          reapack-index --rebuild --name "BSS Scripts" --commit --amend
          
      - name: Push updated index
        run: git push origin HEAD:${{ github.ref }}
